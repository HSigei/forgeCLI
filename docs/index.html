<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — terminal coding agent</title>
<meta name="description" content="Forge is a terminal coding agent that spreads work across your API keys and providers, so one rate limit never stops you.">
<style>
  :root { --bg:#0a0912; --panel:#13111f; --text:#e9e6f5; --muted:#9a94b5; --pink:#ff4fd8; --cyan:#3ef0ff; --line:#2a2540; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:72px 16px 40px; text-align:center; background:radial-gradient(60% 80% at 50% 0%,#2a0f3a 0%,var(--bg) 70%); }
  h1.brand { margin:0; font:800 clamp(44px,9vw,84px)/1 ui-monospace,"Cascadia Code",Consolas,monospace; letter-spacing:.08em;
             color:var(--pink); text-shadow:0 0 18px #ff4fd880,0 0 2px #fff; }
  header p { max-width:640px; margin:18px auto 26px; color:var(--muted); font-size:18px; }
  .install { display:inline-block; max-width:100%; overflow-x:auto; padding:12px 18px; border:1px solid var(--line); border-radius:10px;
             background:var(--panel); font:15px ui-monospace,Consolas,monospace; color:var(--cyan); }
  nav { display:flex; gap:20px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  nav a, main a { color:var(--cyan); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  main h1 { display:none; }
  main h2 { margin-top:2.2em; padding-bottom:.3em; border-bottom:1px solid var(--line); color:var(--pink); }
  main h3 { color:#ffd3f5; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; overflow-x:auto; }
  code { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:.92em; }
  :not(pre) > code { background:#1d1930; padding:.1em .35em; border-radius:4px; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  img { max-width:100%; }
  footer { text-align:center; color:var(--muted); padding:24px 16px 40px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1 class="brand">FORGE</h1>
  <p>A terminal coding agent that reads and edits your files, runs commands, and spreads requests across your API keys and providers, so one rate limit never stops your work.</p>
  <div class="install">pipx install forgecommandline</div>
  <nav><a href="#readme">Docs</a><a id="gh" href="https://github.com/">GitHub</a><a id="rel" href="https://github.com/">Windows download</a></nav>
</header>
<main id="readme"><p>Loading the guide…</p></main>
<footer>Forge is open source under the MIT licence.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  // The docs workflow copies README.md next to this page, so the site always matches the code.
  var repo = (location.hostname.endsWith("github.io") ? location.hostname.split(".")[0] + "/" + (location.pathname.split("/")[1] || "forge-cli") : "");
  if (repo) {
    document.getElementById("gh").href = "https://github.com/" + repo;
    document.getElementById("rel").href = "https://github.com/" + repo + "/releases/latest";
  }
  fetch("README.md").then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (md) {
    var el = document.getElementById("readme");
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("a[href^='http']").forEach(function (a) { a.rel = "noopener"; a.target = "_blank"; });
  }).catch(function () {
    document.getElementById("readme").innerHTML = "<p>The guide couldn't load. Read it on GitHub instead.</p>";
  });
</script>
</body>
</html>
