name = "forge-ads"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
ADS_ENABLED = "1"   # kill switch: "0" turns every sponsor line off immediately

[[d1_databases]]
binding = "DB"
database_name = "forge-ads"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

# Secrets (never in this file):
#   wrangler secret put AD_SIGNING_KEY   <- private key from `python -m forgecli.ads keygen`
#   wrangler secret put ADMIN_TOKEN      <- any long random string, for /admin/*
