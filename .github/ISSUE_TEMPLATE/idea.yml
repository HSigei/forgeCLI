name: Idea or feature request
description: Something Forge should do, or do better
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Forge to do, and what problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today instead
  - type: input
    id: env
    attributes:
      label: Forge version
      placeholder: "0.8.1"
