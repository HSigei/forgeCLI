# On a version tag (v0.8.0 ...): run the tests, build a standalone forge.exe with PyInstaller (no
# Python needed on the user's machine) and the Forge Remote phone app, and attach them to a GitHub
# Release. Stable names (ForgeSetup.exe, forge-remote.apk) let the website link
# releases/latest/download/<name>, and installed forge.exe builds update from the same URL.
# The Scoop manifest in packaging/scoop picks up new releases automatically (autoupdate);
# winget needs one `wingetcreate update` per release (see packaging/README.md).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python tests/test_failover.py
      - name: Build forge.exe
        run: >-
          pyinstaller run.py --name forge --onefile --console --noconfirm
          --collect-data forgecli
          --collect-submodules forgecli
          --add-data "skills;skills"
      - name: Smoke test
        run: dist\forge.exe --version
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Copy-Item dist\forge.exe ForgeSetup.exe
          Compress-Archive -Path dist\forge.exe, README.md -DestinationPath "forge-$v-windows-x64.zip"
          foreach ($f in "forge-$v-windows-x64.zip", "ForgeSetup.exe") {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "$f.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ForgeSetup.exe
            ForgeSetup.exe.sha256
            forge-*-windows-x64.zip
            forge-*-windows-x64.zip.sha256

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build forge-remote.apk
        env:
          KEYSTORE_B64: ${{ secrets.FORGE_KEYSTORE_B64 }}
          FORGE_KEYSTORE_PASS: ${{ secrets.FORGE_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forge.jks"
            export FORGE_KEYSTORE="$RUNNER_TEMP/forge.jks"
          fi
          python3 android/build.py
          cp android/build/forge-remote.apk .
          sha256sum forge-remote.apk | cut -d' ' -f1 > forge-remote.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            forge-remote.apk
            forge-remote.apk.sha256

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.ref_name }}"
          gh release create "$v" out/* --title "Forge $v" --generate-notes
