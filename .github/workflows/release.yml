# On a version tag (v0.8.0 ...): run the tests, build a standalone forge.exe with PyInstaller (no
# Python needed on the user's machine), and attach it to a GitHub Release with its SHA-256.
# The Scoop manifest in packaging/scoop picks up new releases automatically (autoupdate);
# winget needs one `wingetcreate update` per release (see packaging/README.md).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python tests/test_failover.py
      - name: Build forge.exe
        run: >-
          pyinstaller run.py --name forge --onefile --console --noconfirm
          --collect-data forgecli
          --collect-submodules forgecli
          --add-data "skills;skills"
      - name: Smoke test
        run: dist\forge.exe --version
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path dist\forge.exe, README.md -DestinationPath "forge-$v-windows-x64.zip"
          (Get-FileHash "forge-$v-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "forge-$v-windows-x64.zip.sha256"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          gh release create $v "forge-$v-windows-x64.zip" "forge-$v-windows-x64.zip.sha256" --title "Forge $v" --generate-notes
