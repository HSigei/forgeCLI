[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecommandline"
version = "0.8.7"
description = "A terminal coding agent with provider failover"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harry Sigei (HK Labs)" }]
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "PyYAML>=6.0",
    "keyring>=25.0",
    "graphifyy>=0.9.100",
]

[project.scripts]
forge = "forgecli.cli:main"

[project.urls]
Homepage = "https://forgecli.pages.dev"
Source = "https://github.com/HSigei/forgeCLI"
Issues = "https://github.com/HSigei/forgeCLI/issues"

[tool.setuptools]
packages = ["forgecli"]

[tool.setuptools.package-data]
forgecli = ["courier_hd_data.bin", "scene_data.bin", "tiger_data.bin", "cub_data.bin"]

