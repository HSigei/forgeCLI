[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecommandline"
version = "0.8.0"
description = "A terminal coding agent with provider failover"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "PyYAML>=6.0",
    "keyring>=25.0",
]

[project.scripts]
forge = "forgecli.cli:main"

[tool.setuptools]
packages = ["forgecli"]

[tool.setuptools.package-data]
forgecli = ["courier_hd_data.bin"]

[tool.setuptools.data-files]
